// Core Configuration File for CS2 Admin (Metamod Plugin)
// Place this file at: <game_root>/cfg/cs2admin/core.cfg

"cs2admin"
{
    "Config"
    {
        "Website"               "http://www.yourwebsite.net/sourcebans"
        "ChatPrefix"            "{purple}[CS2 Admin] "

        "CommandPrefix"         "!"
        "SilentCommandPrefix"   "/"

        "DefaultLanguage"       "en"

        "Addban"                "1"
        "Unban"                 "1"

        "DatabasePrefix"        "sb"
        "RetryTime"             "45.0"
		"MaxReconnectAttempts"	"5"
        "ProcessQueueTime"      "5"
        "AutoAddServer"         "0"
        "BackupConfigs"         "1"
        "EnableAdmins"          "1"
        "RequireSiteLogin"      "0"
        "ServerID"              "-1"

        "LogToFile"             "1"
        "LogRetentionDays"      "30"
    }

    // Database connection settings (replaces SourceMod's databases.cfg)
    "Database"
    {
        "Type"      "sqlite"
        "Host"      "localhost"
        "User"      "root"
        "Pass"      ""
        "Database"  "sourcemod"
        "Port"      "3306"
        "Path"      "addons/cs2admin/data/cs2admin.db"
    }

    // SourceComms configuration
    "CommsConfig"
    {
        "DefaultTime"                   "30"
        "DisableUnblockImmunityCheck"   "0"
        "ConsoleImmunity"               "20"
        "MaxLength"                     "0"
    }

    // Checker: notify admins of player history on connect
    "CheckerConfig"
    {
        // Print ban/comm history to admins when a player connects
        "PrintCheckOnConnect"           "1"
    }

    // Player report system
    "ReportConfig"
    {
        // Cooldown between reports per player (seconds)
        "Cooldown"                      "60.0"
        // Minimum character length for report reason
        "MinLength"                     "10"
    }

    // IP Sleuth: detect ban evasion via IP matching
    "SleuthConfig"
    {
        // Action when evasion detected:
        // 0 = disabled, 1 = ban (copy original), 2 = ban (custom duration),
        // 3 = ban (both original + custom), 4 = notify admins only, 5 = kick
        "Actions"                       "0"
        // Ban duration in minutes for action 2 (0 = permanent)
        "Duration"                      "0"
        // Number of IP-matched bans required before acting
        "BansAllowed"                   "0"
        // 0 = match all bans, 1 = only permanent bans
        "BanType"                       "0"
        // Players with ADMFLAG_BAN are exempt from sleuth checks
        "AdminBypass"                   "0"
        // Exclude old bans from matching
        "ExcludeOld"                    "0"
        // Max age of bans to consider in seconds (default: 1 year)
        "ExcludeTime"                   "31536000"
    }

    // Discord webhook integration
    "DiscordConfig"
    {
        // Discord webhook URL for admin action notifications.
        // Leave empty to disable. Must be a valid Discord webhook URL.
        "WebhookUrl"                    ""
        // Text shown in the footer of Discord embeds
        "FooterText"                    "CS2Admin"
    }

    // Anti chat flood
    "ChatFloodConfig"
    {
        // Minimum seconds between chat messages (0 = disabled)
        "Cooldown"                      "0.75"
        // Number of rapid messages before action is taken
        "MaxMessages"                   "5"
        // Minutes to auto gag flooding players (0 = block message only, no gag)
        "MuteDuration"                  "0"
    }

    // Chat and scoreboard tags. Tags themselves are defined in tags.cfg.
    "TagsConfig"
    {
        // Render player chat ourselves instead of letting the game do it.
        // Required for chat tags: a tag can't be added to a line we don't render.
        //
        // Only one plugin on a server can own chat, two produce duplicate lines, so this stays off unless you ask for it.
        // It also switches itself off when cs2kz-metamod is loaded with its own "overridePlayerChat" set to true (its default).
        // Set that to false in cfg/cs2kz-server-config.txt to hand chat to us instead.
        //
        // While this is on, we render the line, so the formats below fully replace the game's chat layout.
        "ChatOwnership"                 "0"
        // Show tags in chat. Turns ChatOwnership on by itself.
        "ChatTags"                      "0"
        // Show tags on the scoreboard, via the clan tag.
        // Switches itself off when cs2kz-metamod is loaded with its "kz_profile_clantag_enabled" convar on (its default).
        // Set that convar to 0 to hand the clan tag to us.
        "LeaderboardTags"               "0"

        // Chat line layout.
        // Tokens: {tag} {name} {msg} {namecolor} {msgcolor} {teamcolor} {teamname}
        // Color tags work too, see tags.cfg for the list.
        "Format"                        "{tag}{namecolor}{name}{default}: {msgcolor}{msg}"
        // Dead players.
        "FormatDead"                    "{grey}*{default} {tag}{namecolor}{name}{default}: {msgcolor}{msg}"
        // Team chat, which only reaches the speaker's team.
        "FormatTeam"                    "{grey}({teamname}){default} {tag}{namecolor}{name}{default}: {msgcolor}{msg}"
        "FormatTeamDead"                "{grey}*({teamname}){default} {tag}{namecolor}{name}{default}: {msgcolor}{msg}"

        // Which palette color stands in for each team, used by {teamcolor} and by {namecolor} when a tag doesn't set its own. 
        "TeamColorCT"                   "{blue}"
        "TeamColorT"                    "{gold}"
        "TeamColorSpec"                 "{grey}"

    }

    // Menu integration (only applies when the optional mm-cs2menus plugin is loaded).
    "MenuConfig"
    {
        // Menu rendering style:
        //   "default" - let mm-cs2menus' own config decide (chat or html)
        //   "chat"    - force chat menus (numbered list, type 1-9/0)
        //   "html"    - force center-screen html menus (movement keys)
        "Type"                          "default"
        // Duration presets for the ban/mute/gag/silence picker.
        // Comma-separated minutes, or 0 for permanent. Suffixes work too: 1h, 2d, 1w, 1m.
        "Durations"                     "30,60,180,1440,10080,0"
        // Reason presets for the ban/mute/gag/silence/kick picker (comma-separated).
        "Reasons"                       "Cheating,Toxicity,Spam,Advertising,Ban Evasion,Other"

        // HTML menu navigation key overrides (html menus only).
        //   "default" - use the key mm-cs2menus is configured with
        //   "none"    - disable this action (e.g. NavUp "none" = single-key scroll)
        //   otherwise a key name: w a s d, e/use, shift/speed, ctrl/duck,
        //              space/jump, r/reload, mouse1, mouse2, tab, f/inspect
        "NavUp"                         "default"  // move cursor up
        "NavDown"                       "default"  // move cursor down
        "NavSelect"                     "default"  // select highlighted item
        "NavBack"                       "default"  // close / exit
    }
}
