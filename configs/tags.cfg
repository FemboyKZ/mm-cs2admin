// CS2 Admin Tags Configuration
// Place this file at: <game_root>/cfg/cs2admin/tags.cfg
//
// Tags are shown in chat and/or next to a player's name on the scoreboard.
// Both are off by default, turn them on in core.cfg under "TagsConfig".
//
// A player may match several tags. The highest "priority" is shown by default, and they can pick a different one (or hide it) with !tag.
//
// KEYS
//
//   "match"        What the tag matches on. One of:
//                    "steamid"   - one player, any SteamID format
//                    "ip"        - one IP, exact match, no masks
//                    "flag"      - holds any one of the listed admin flags
//                    "group"     - admin's group name
//                    "immunity"  - immunity at or above the value
//   "value"        The thing to match, read according to "match".
//   "priority"     Higher wins when a player matches several tags. Default 0.
//   "chattag"      Shown in chat. Colors allowed.
//   "namecolor"    Color of the player's name. Empty = their team color.
//   "messagecolor" Color of the message body. Empty = {default}.
//   "boardtag"     Shown on the scoreboard. No colors, the scoreboard has none.
//
// A tag that sets none of chattag/namecolor/messagecolor/boardtag is skipped.
//
//
// COLORS
//
//   {default}  {darkred}   {purple}   {green}
//   {olive}    {lime}      {red}      {grey}
//   {yellow}   {bluegrey}  {blue}     {darkblue}
//   {grey2}    {orchid}    {lightred} {gold}
//
//
// FLAG REFERENCE (same as SourceMod)
//   a - Reserved slot        b - Generic admin
//   c - Kick                 d - Ban
//   e - Unban                f - Slay
//   g - Map change           h - ConVar access
//   i - Config               j - Chat commands
//   k - Vote                 l - Password
//   m - RCON                 n - Cheats
//   o-t - Custom flags 1-6   z - Root (all access)
//
// Note: a root (z) admin passes every flag match, exactly as they do for command access.
// Root admins are therefore eligible for every flag tag and pick between them with !tag.

"Tags"
{
    // The section name is the tag's id.
    // It's what !tag takes and what gets stored, so renaming one resets the pick of everyone using it.

    "Owner"
    {
        "match"         "flag"
        "value"         "z"
        "priority"      "100"
        "chattag"       "{red}[OWNER] "
        "namecolor"     "{lightred}"
        "boardtag"      "OWNER"
    }

    "Admin"
    {
        "match"         "flag"
        "value"         "d"
        "priority"      "50"
        "chattag"       "{blue}[ADMIN] "
        "namecolor"     "{bluegrey}"
        "boardtag"      "ADMIN"
    }

    // "Moderator"
    // {
